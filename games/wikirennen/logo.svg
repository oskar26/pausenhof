<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Wikirennen">
  <!-- Wikirennen-Logo: eigene Puzzle-Kugel mit Zielflagge. Selbst gezeichnet – made by Oskar -->
  <defs>
    <radialGradient id="wrS" cx="36%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#e4e6e9"/>
      <stop offset=".85" stop-color="#a9adb3"/>
      <stop offset="1" stop-color="#7d8288"/>
    </radialGradient>
    <clipPath id="wrC"><path d="M50 6a44 44 0 1 0 44 44c0-6-1.2-11.6-3.3-16.8L72 33 66 14C61 9.5 55.8 6 50 6z"/></clipPath>
    <pattern id="wrF" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fff"/><rect width="4" height="4" fill="#202122"/><rect x="4" y="4" width="4" height="4" fill="#202122"/>
    </pattern>
  </defs>
  <g clip-path="url(#wrC)">
    <circle cx="50" cy="50" r="44" fill="url(#wrS)"/>
    <g fill="none" stroke="#5f646b" stroke-width="1.3" stroke-linejoin="round" opacity=".75">
      <!-- Puzzle-Nähte -->
      <path d="M50 6c-9 10-13 24-13 44s4 34 13 44"/>
      <path d="M50 6c9 10 13 24 13 44s-4 34-13 44"/>
      <path d="M8 36c12 3 18 1 24-1 3 5 9 5 10 0 7-1 14-1 21 1"/>
      <path d="M63 36c3-5 9-4 10 1 6 0 13 1 19 3"/>
      <path d="M6 58c11 3 20 3 31 1 2 5 9 6 10 0 6 0 11 1 16-1 2 5 9 5 10 0 8-1 14-2 20-4"/>
      <path d="M14 80c8 2 16 3 23 2 4 4 9 3 9-2 6 0 12-1 17-2"/>
      <path d="M24 16c-1 5 4 8 7 6"/>
      <path d="M74 75c-4-1-6 4-3 7"/>
    </g>
    <g font-family="'Libertinus Serif','Linux Libertine',Georgia,serif" fill="#3c4046" text-anchor="middle">
      <text x="23" y="31" font-size="15">R</text>
      <text x="43" y="27" font-size="12">Ж</text>
      <text x="56" y="51" font-size="14">Ψ</text>
      <text x="25" y="53" font-size="13">ß</text>
      <text x="77" y="54" font-size="12">Ω</text>
      <text x="42" y="76" font-size="13">Ä</text>
      <text x="62" y="78" font-size="11">λ</text>
      <text x="81" y="72" font-size="10">Я</text>

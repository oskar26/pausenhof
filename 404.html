<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 – Level nicht gefunden · Zockbox</title>
  <meta name="theme-color" content="#0a0b12">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages zeigt diese Seite für jeden falschen Pfad – egal wie tief.
    // Damit CSS und Links stimmen, setzen wir die Basis auf den Projektordner
    // (https://oskar26.github.io/pausenhof/ → Basis "/pausenhof/"). Lokal: "/".
    (function () {
      var p = location.pathname.split('/');
      var base = location.hostname.endsWith('github.io') && p.length > 2 && p[1] ? '/' + p[1] + '/' : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="shared/zockbox.css">
</head>
<body>
  <div class="zb-bg" aria-hidden="true"></div>
  <header class="zb-top">
    <div class="zb-wrap zb-top-in">
      <a class="zb-brand" href="./" aria-label="Zockbox Startseite">
        <span class="zb-mark" aria-hidden="true"><span>Z</span></span>
        <span class="zb-brand-txt"><b>Zockbox</b><small>made by Oskar</small></span>
      </a>
    </div>
  </header>

  <main class="zb-wrap zb-404">
    <div>
      <div class="zb-404-big" aria-hidden="true">404</div>
      <h1>Level nicht gefunden</h1>
      <p>Diese Seite gibt es nicht – vielleicht ein Tippfehler im Link. Du wolltest einer Lobby beitreten? Gib den Code auf der Startseite ein.</p>
      <a class="zb-btn zb-btn-primary" href="./">Zur Zockbox</a>
    </div>
  </main>

  <footer class="zb-foot">
    <div class="zb-wrap">
      <div class="zb-sig">made by <b>Oskar</b></div>
      <p>Zockbox</p>
    </div>
  </footer>
</body>
</html>
